# ─────────────────────────────────────────────────────────────
#  z2roN_Proj (Windows 11 서버 + 웹 화면) 자동 빌드
#  사용법
#   1) 이 폴더 전체를 GitHub 저장소(main)에 올립니다.
#   2) Actions > "z2roN_Proj 빌드" > Run workflow (main 에 올리면 자동 실행)
#   3) 끝나면 실행 맨 아래 Artifacts 의 z2roN_Proj-win-v버전 을 내려받습니다.
#   4) 압축을 풀어 서버 PC(Windows 11)의 원하는 폴더(예: C:\z2roN_Proj)에 넣고
#      install_autostart.bat 를 '관리자 권한'으로 실행하면 방화벽 허용 + 로그인 시 자동 실행이 설정됩니다.
#  결과물: z2roN_Proj.exe 1개(.NET 포함, 별도 설치 불필요) + config.json + 배치 파일들
# ─────────────────────────────────────────────────────────────
name: z2roN_Proj 빌드
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 버전 읽기
        id: ver
        shell: bash
        run: |
          echo "v=$(grep -oP '(?<=<Version>)[^<]+' z2roN_Proj.csproj)" >> "$GITHUB_OUTPUT"
      - name: 게시 (단일 exe)
        run: dotnet publish z2roN_Proj.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: 묶기
        shell: bash
        run: |
          mkdir pack
          cp out/z2roN_Proj.exe pack/
          cp config.json pack/
          cp tools/*.bat pack/
          cp README.md pack/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: z2roN_Proj-win-v${{ steps.ver.outputs.v }}
          path: pack
